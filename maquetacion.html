<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:0;
            background-color:aqua;
            display:grid;
            grid-template-rows:300px 600px 200px;
            grid-template-columns: 70% 30%;
            grid-template-areas:
            " w w"
            " x y"
            " z z";
        }
        #uno{
            background-color: red;
            grid-area: w;
        }
        #dos{
            background-color: blue;
            grid-area: x;
        }
        #tres{
            background-color: green;
            grid-area: y;
        }
        #cuatro{
            background-color: yellow;
            grid-area: z;
        }
        
    </style>
</head>
<body>
    <header id="uno">1</header>
    <section id="dos">2</section>
    <section id="tres">3</section>
    <footer id="cuatro">4</footer>
</body>
</html>
